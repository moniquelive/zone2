name: Release

on:
  push:
    tags:
      - "**"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Build release binaries
        run: mise run dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/zone2-linux-arm64
            dist/zone2-macos-arm64
            dist/zone2-macos-amd64
